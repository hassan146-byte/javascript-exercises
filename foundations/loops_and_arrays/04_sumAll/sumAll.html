    <script>

const sumAll = function(num1, num2) {
let sum = 0
if (num2 > num1 && num2 >= 0 && num1 >= 0) { 
    for (let i = num1; i <= num2; i++)
        sum += i;
        return sum; }
else if (num1 > num2 && num2 >= 0 && num1 >= 0) {
    for (let i = num2; i <= num1; i++)
        sum += i;
        return sum; }
else {
    return "ERROR" }
};

console.log(sumAll(2, 4));

    </script>
